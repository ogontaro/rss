name: daily

on:
  schedule:
    - cron: "0 22 * * *" # 07:00 JST
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: docs-write
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile

      - name: refresh translated feed
        run: bun run src/translate.ts
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}

      - name: collect last 24h
        run: bun run src/report/collect.ts

      - name: stop if nothing to curate
        run: |
          test "$(jq 'length' .cache/daily-input.json)" -gt 0 \
            || { echo "no entries in the last 24h — nothing to report"; exit 1; }

      - name: curate with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read ${{ github.workspace }}/.cache/daily-input.json (the last 24h of feed
            entries; titles and descriptions are already in Japanese) and
            ${{ github.workspace }}/report-criteria.md.
            Pick the 5-10 most important entries per the criteria and write a Japanese
            digest to ${{ github.workspace }}/.cache/daily-report.md, following the format
            in report-criteria.md. Write only that one file. Do not modify anything under docs/.
          claude_args: "--allowedTools Read,Write"

      - name: render report
        run: bun run src/report/render.ts
      - run: bun run src/build.ts

      - name: commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "daily: report"
          git push
