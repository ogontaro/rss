[tools]
bun = "1.3"

[tasks.translate]
description = "Fetch feeds, translate new entries, rewrite docs/translated.xml"
run = "bun run src/translate.ts"

[tasks."report:collect"]
description = "Collect the last 24h from docs/translated.xml into .cache/daily-input.json"
run = "bun run src/report/collect.ts"

[tasks."report:render"]
description = "Render .cache/daily-report.md into docs/daily/*.html and docs/daily.xml"
run = "bun run src/report/render.ts"

[tasks.build]
description = "Regenerate docs/index.html and assets from what is on disk"
run = "bun run src/build.ts"

[tasks."import:opml"]
description = "Convert an Inoreader OPML export into feeds.yaml (one-shot)"
run = "bun run src/import-opml.ts"

[tasks.serve]
description = "Preview docs/ locally on :3000"
run = "bunx serve docs"

[tasks.lint]
run = "bunx @biomejs/biome check ."

[tasks.format]
run = "bunx @biomejs/biome format --write ."
